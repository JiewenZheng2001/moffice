# Cloudflare Workers 部署配置
# 用法：
#   cd workers
#   pnpm install          # 安装依赖（hono）
#   npx wrangler login    # 登录（免费，无需信用卡）
#   npx wrangler deploy   # 部署
#
# 部署后得到域名：https://moffice-api.<your-subdomain>.workers.dev
# 前端 VITE_API_BASE 指向该域名
name = "moffice-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 环境变量（本地开发占位；生产 JWT_SECRET 用 `wrangler secret put` 覆盖，不落明文）
[vars]
CORS_ORIGIN = "https://moffice-seven.vercel.app"

# D1 数据库（SQLite 兼容，免费 5GB）
[[d1_databases]]
binding = "DB"
database_name = "moffice"
database_id = "8745aedd-8b49-4947-8328-8630c9d793da"

# 环境变量（部署后在 Cloudflare Dashboard → Workers → moffice-api → Settings → Variables 设置）
# JWT_SECRET: 必填，随机长字符串
# CORS_ORIGIN: 前端域名，逗号分隔（如 https://moffice-seven.vercel.app）
